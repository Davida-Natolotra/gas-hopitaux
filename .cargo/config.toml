# Windows 7 does not ship the Universal CRT, and these are offline hospital
# desktops where installing KB2999226 or the VC++ redistributable on each
# machine is not practical. Linking the CRT statically folds it into the exe,
# so the binary has no `api-ms-win-crt-*.dll` or `VCRUNTIME140.dll` imports at
# all and runs on a bare Win7 SP1 install.
#
# The `cc` crate picks up `crt-static` from CARGO_CFG_TARGET_FEATURE and
# switches its own C compilation (sqlite3, vswhom) to /MT to match, so the CRT
# choice stays consistent across the whole link.
#
# This flag alone is not sufficient: `tauri build` sets STATIC_VCRUNTIME=true,
# and tauri-build then force-links the *dynamic* UCRT with link args that
# override it. See the matching comment in src-tauri/build.rs — both halves are
# required, and changing one without the other silently brings back the
# dependency on a CRT that Windows 7 does not have.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

# The pinned 1.77.2 cargo resolves dependencies without looking at their MSRV,
# so it happily locks crates that need edition 2024 / Rust 1.85+ and the build
# then fails with "feature `edition2024` is required". Newer cargo (1.84+)
# honours this setting together with `rust-version` in src-tauri/Cargo.toml.
#
# Even so, do NOT run a blanket `cargo update`: a crate that compiles on 1.77
# can still call Windows 8/10-only APIs at runtime (e.g. getrandom 0.3 uses
# ProcessPrng), which only shows up on a real Windows 7 machine. Update named
# crates only (`cargo +stable update <crate>`) and check that
# `cargo tree --target x86_64-pc-windows-msvc` is unchanged unless that was
# the point. Some crates use edition 2024 without declaring `rust-version`
# (dlopen2 >= 0.8.1, dlopen2_derive >= 0.4.2); those need `--precise`.
[resolver]
incompatible-rust-versions = "fallback"
